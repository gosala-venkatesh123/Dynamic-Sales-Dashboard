<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Sales Dashboard</title>

  <!-- Chart.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #24292f;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h3 {
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 28px;
      font-weight: bold;
      color: #007bff;
    }

    .chart-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Dynamic Sales Dashboard</h1>
    <p>Single-file web application</p>
  </header>

  <div class="container">

    <div class="cards">
      <div class="card">
        <h3>Total Sales</h3>
        <p id="totalSales">₹0</p>
      </div>

      <div class="card">
        <h3>Average Sales</h3>
        <p id="averageSales">₹0</p>
      </div>

      <div class="card">
        <h3>Best Month</h3>
        <p id="bestMonth">-</p>
      </div>
    </div>

    <div class="chart-box">
      <h2>Monthly Sales</h2>
      <br>
      <canvas id="salesChart"></canvas>

      <button onclick="addRandomData()">
        Add Random Month
      </button>
    </div>

    <footer>
      <p>Deployed as a static webpage</p>
    </footer>

  </div>

  <script>
    // Initial dynamic data
    let salesData = {
      labels: [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June"
      ],

      values: [
        12000,
        19000,
        15000,
        22000,
        28000,
        25000
      ]
    };

    // Create chart
    const ctx = document
      .getElementById("salesChart")
      .getContext("2d");

    const salesChart = new Chart(ctx, {
      type: "line",

      data: {
        labels: salesData.labels,

        datasets: [{
          label: "Sales (₹)",
          data: salesData.values,

          borderColor: "#007bff",
          backgroundColor: "rgba(0, 123, 255, 0.15)",

          borderWidth: 3,
          fill: true,

          tension: 0.4,

          pointBackgroundColor: "#007bff",
          pointRadius: 5
        }]
      },

      options: {
        responsive: true,

        plugins: {
          legend: {
            display: true
          }
        },

        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    // Update dashboard cards
    function updateDashboard() {

      const values = salesData.values;

      const total = values.reduce(
        (sum, value) => sum + value,
        0
      );

      const average = total / values.length;

      const maxValue = Math.max(...values);

      const bestIndex = values.indexOf(maxValue);

      document.getElementById("totalSales")
        .textContent = "₹" + total.toLocaleString("en-IN");

      document.getElementById("averageSales")
        .textContent = "₹" +
        Math.round(average).toLocaleString("en-IN");

      document.getElementById("bestMonth")
        .textContent = salesData.labels[bestIndex];
    }

    // Add new random data
    function addRandomData() {

      const monthNumber = salesData.labels.length + 1;

      const newMonth = "Month " + monthNumber;

      const newValue =
        Math.floor(Math.random() * 30000) + 5000;

      salesData.labels.push(newMonth);
      salesData.values.push(newValue);

      salesChart.update();

      updateDashboard();
    }

    // Initial dashboard calculation
    updateDashboard();
  </script>

</body>
</html>
